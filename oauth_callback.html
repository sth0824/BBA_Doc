<!DOCTYPE html>
<html>
<head>
    <title>로그인 처리 중...</title>
    <script>
        window.onload = function() {
            try {
                const token = "{{ token }}";
                if (token) {
                    localStorage.setItem('kakao_access_token', token);
                    if (window.opener) {
                        // 부모 창 새로고침 전에 약간의 지연 추가
                        setTimeout(() => {
                            window.opener.location.href = '/';  // 전체 페이지 리로드
                            window.close();
                        }, 500);
                    } else {
                        // opener가 없는 경우 메인 페이지로 리다이렉트
                        window.location.href = '/';
                    }
                }
            } catch (error) {
                console.error("Error in callback:", error);
                window.location.href = '/';
            }
        };
    </script>
</head>
<body>
    <p style="text-align: center; margin-top: 20px;">로그인 처리 중입니다...</p>
</body>
</html>
