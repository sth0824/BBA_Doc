{# Jinja2 Template #}
<!DOCTYPE html>
<html>
<head>
    <title>로그인 처리 중...</title>
    <script>
        // @ts-nocheck
        window.onload = function() {
            try {
                console.log("OAuth 콜백 페이지 로드됨");
                
                // 서버에서 전달된 데이터
                const token = "{{ token or '' }}";
                const userInfo = {{ user_info|tojson|safe or '{}' }};
                
                if (token && Object.keys(userInfo).length > 0) {
                    // 토큰과 사용자 정보가 있는 경우에만 저장
                    localStorage.setItem('kakao_access_token', token);
                    localStorage.setItem('user_info', JSON.stringify(userInfo));
                    console.log("로그인 정보 저장 성공");
                    
                    // 메인 페이지로 이동
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else {
                    console.error("로그인 정보 불완전");
                    window.location.href = '/';
                }
            } catch (error) {
                console.error("OAuth 처리 중 에러:", error);
                window.location.href = '/';
            }
        };
    </script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <h2>로그인 처리 중입니다</h2>
        <p style="color: #666;">잠시만 기다려주세요...</p>
    </div>
</body>
</html>
