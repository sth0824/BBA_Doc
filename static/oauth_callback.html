<!DOCTYPE html>
<html>
<head>
    <title>로그인 처리 중...</title>
    <script>
        window.onload = function() {
            try {
                console.log("OAuth 콜백 페이지 로드됨");
                const token = "{{ token }}";
                console.log("받은 토큰:", token ? "존재" : "없음");
                
                if (token) {
                    console.log("토큰을 로컬 스토리지에 저장 시도");
                    localStorage.setItem('kakao_access_token', token);
                    
                    if (window.opener) {
                        console.log("부모 창이 존재함, 리다이렉트 시도");
                        // 부모 창 새로고침 전에 약간의 지연 추가
                        setTimeout(() => {
                            console.log("부모 창 리다이렉트 실행");
                            window.opener.location.href = '/';
                            console.log("창 닫기 시도");
                            window.close();
                        }, 500);
                    } else {
                        console.log("부모 창이 없음, 직접 리다이렉트");
                        window.location.href = '/';
                    }
                } else {
                    console.error("토큰이 없음");
                    window.location.href = '/';
                }
            } catch (error) {
                console.error("OAuth 콜백 처리 중 에러:", error);
                window.location.href = '/';
            }
        };
    </script>
</head>
<body>
    <p style="text-align: center; margin-top: 20px;">로그인 처리 중입니다...</p>
</body>
</html>
