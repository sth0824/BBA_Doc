{# Jinja2 Template #}
<!DOCTYPE html>
<html>
<head>
    <title>로그인 처리 중...</title>
    <script>
        window.onload = function() {
            try {
                console.log("OAuth 콜백 페이지 로드됨");
                
                // 서버에서 전달된 데이터를 직접 출력해서 확인
                const serverData = {
                    token: '{{ token }}',
                    user_info: {{ user_info|tojson|safe }}
                };
                
                console.log("서버에서 받은 데이터:", serverData);

                if (serverData.token && serverData.user_info && serverData.user_info.id) {
                    // 로컬 스토리지에 저장
                    localStorage.setItem('kakao_access_token', serverData.token);
                    localStorage.setItem('user_info', JSON.stringify(serverData.user_info));
                    console.log("로그인 정보 저장 완료");
                    
                    // 메인 페이지로 이동
                    window.location.href = '/';
                } else {
                    console.error("필수 정보 누락:", serverData);
                    window.location.href = '/';
                }
            } catch (error) {
                console.error("OAuth 처리 중 에러:", error);
                window.location.href = '/';
            }
        };
    </script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <h2>로그인 처리 중입니다</h2>
        <p style="color: #666;">잠시만 기다려주세요...</p>
    </div>
</body>
</html>
