<!DOCTYPE html>
<html>
<head>
    <title>로그인 처리 중...</title>
    <script>
        window.onload = function() {
            try {
                console.log("OAuth 콜백 페이지 로드됨");
                const token = "{{ token }}";
                console.log("토큰 존재 여부:", !!token);
                
                if (token) {
                    console.log("토큰 저장 시도");
                    localStorage.setItem('kakao_access_token', token);
                    
                    // 팝업 방식과 리다이렉트 방식 모두 처리
                    if (window.opener) {
                        console.log("팝업 방식으로 처리");
                        window.opener.postMessage({ type: 'LOGIN_SUCCESS', token }, '*');
                        setTimeout(() => window.close(), 500);
                    } else {
                        console.log("리다이렉트 방식으로 처리");
                        window.location.replace('/');
                    }
                } else {
                    console.error("토큰이 없음");
                    alert("로그인 처리 중 오류가 발생했습니다.");
                    window.location.replace('/');
                }
            } catch (error) {
                console.error("OAuth 콜백 처리 중 에러:", error);
                alert("로그인 처리 중 오류가 발생했습니다.");
                window.location.replace('/');
            }
        };
    </script>
</head>
<body>
    <p style="text-align: center; margin-top: 20px;">로그인 처리 중입니다...</p>
    <p style="text-align: center; font-size: 12px;">자동으로 페이지가 이동하지 않으면 <a href="/" onclick="window.location.replace('/'); return false;">여기</a>를 클릭하세요.</p>
</body>
</html>
