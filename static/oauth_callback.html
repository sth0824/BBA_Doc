<!DOCTYPE html>
<html>
<head>
    <title>로그인 처리 중...</title>
    <script>
        window.onload = function() {
            try {
                const token = "{{ token }}";
                console.log("Received token:", token); // 디버깅용
                
                if (token) {
                    localStorage.setItem('kakao_access_token', token);
                    
                    // window.opener가 없는 경우를 대비한 처리
                    if (window.opener && !window.opener.closed) {
                        window.opener.location.reload();
                        window.close();
                    } else {
                        // opener가 없는 경우 메인 페이지로 이동
                        window.location.href = '/';
                    }
                } else {
                    console.error("Token not received");
                    window.location.href = '/';
                }
            } catch (error) {
                console.error("Error in callback:", error);
                window.location.href = '/';
            }
        };
    </script>
</head>
<body>
    <p style="text-align: center; margin-top: 20px;">로그인 처리 중입니다...</p>
</body>
</html>
