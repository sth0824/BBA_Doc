<!DOCTYPE html>
<html>
<head>
    <title>로그인 처리 중...</title>
    <script>
        window.onload = function() {
            const token = "{{ token }}";
            if (token) {
                localStorage.setItem('kakao_access_token', token);
                window.opener.location.reload();
            }
            window.close();
        };
    </script>
</head>
<body>
    <p>로그인 처리 중입니다...</p>
</body>
</html>
