<!DOCTYPE html>
<html>
<head>
    <title>로그인 처리 중...</title>
    <script>
        window.onload = function() {
            try {
                console.log("OAuth 콜백 페이지 로드됨");
                
                const serverData = {
                    token: '{{ token }}',
                    user_info: {{ user_info|tojson|safe }}
                };
                
                console.log("서버에서 받은 데이터:", serverData);
                console.log("사용자 정보:", serverData.user_info);
                console.log("토큰:", serverData.token);

                if (serverData.token && serverData.user_info) {
                    // 로컬 스토리지에 저장할 때 필요한 모든 사용자 정보를 포함
                    localStorage.setItem('kakao_access_token', serverData.token);
                    localStorage.setItem('user_info', JSON.stringify({
                        id: serverData.user_info.id,
                        nickname: serverData.user_info.properties.nickname,
                        profile_image: serverData.user_info.properties.profile_image
                    }));
                    
                    console.log("로그인 정보 저장 완료");
                    
                    // 상태 메시지 업데이트
                    document.getElementById('status').textContent = '로그인 정보 저장 완료';
                    
                    // 3초 후에 메인 페이지로 이동
                    setTimeout(() => {
                        document.getElementById('status').textContent = '메인 페이지로 이동합니다...';
                        window.location.href = '/';
                    }, 3000);
                } else {
                    console.error("필수 정보 누락:", serverData);
                    document.getElementById('status').textContent = '로그인 정보 누락';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 3000);
                }
            } catch (error) {
                console.error("OAuth 처리 중 에러:", error);
                document.getElementById('status').textContent = '로그인 처리 중 오류 발생';
                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);
            }
        };
    </script>
    <style>
        .container {
            text-align: center;
            margin-top: 50px;
            font-family: Arial, sans-serif;
        }
        .status {
            color: #666;
            margin-top: 20px;
            font-size: 16px;
        }
        .loading {
            margin-top: 20px;
        }
        .loading-dots {
            display: inline-block;
        }
        .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>로그인 처리 중입니다</h2>
        <p id="status" class="status">카카오 로그인 정보 처리 중<span class="loading-dots"></span></p>
        <div class="loading">
            처리 완료 후 자동으로 메인 페이지로 이동합니다.
        </div>
    </div>
</body>
</html>
