<!DOCTYPE html>
<html>
<head>
    <title>로그인 처리 중...</title>
    <script>
        window.onload = function() {
            try {
                console.log("OAuth 콜백 페이지 로드됨");
                const token = "{{ token }}";
                const userInfo = {{ user_info|tojson|safe if user_info else 'null' }};
                const error = "{{ error }}";
                
                console.log("토큰 수신 상태:", !!token);
                console.log("사용자 정보 수신 상태:", !!userInfo);
                
                if (error) {
                    console.error("에러 발생:", error);
                    alert("로그인 처리 중 오류가 발생했습니다.");
                    window.location.href = '/';
                    return;
                }
                
                if (token && userInfo) {
                    console.log("토큰 및 사용자 정보 저장 시작");
                    localStorage.setItem('kakao_access_token', token);
                    localStorage.setItem('user_info', JSON.stringify(userInfo));
                    console.log("저장 완료");
                    
                    // 메인 페이지로 이동
                    setTimeout(() => {
                        console.log("메인 페이지로 이동");
                        window.location.href = '/';
                    }, 1000);
                } else {
                    console.error("필요한 정보가 없음");
                    alert("로그인 처리 중 오류가 발생했습니다.");
                    window.location.href = '/';
                }
            } catch (error) {
                console.error("OAuth 콜백 처리 중 에러:", error);
                alert("로그인 처리 중 오류가 발생했습니다.");
                window.location.href = '/';
            }
        };
    </script>
</head>
<body>
    <p style="text-align: center; margin-top: 20px;">로그인 처리 중입니다...</p>
    <p style="text-align: center; font-size: 12px;">자시만 기다려주세요...</p>
</body>
</html>
